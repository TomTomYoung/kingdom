name: City bombardment integration verification
on:
  push:
    branches: ['codex/city-bombardment-20261030']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  finalize:
    if: github.ref == 'refs/heads/codex/city-bombardment-20261030'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve the tested implementation and rerun regressions
        run: |
          git diff --exit-code 832140142317fa385500287d50d659c406ac66b9 -- src index.html tests tools/qa
          npm run check
          npm test
      - name: Finalize documentation and source links
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import unquote
          result = json.loads(Path('assets/qa/city-bombardment-summary-2026-10-30.json').read_text())
          assert result['workflowRunId'] == '41014553493'
          assert result['nodeTests'] == 297 and result['syntaxFiles'] == 102
          assert result['saveSnapshots'] == 164 and result['continuationCommands'] == 656
          assert result['browserCheckGroups'] == 115 and result['suites']['city-bombardment'] == 11
          assert result['pageErrors'] == [] and result['httpFailures'] == []
          p = Path('doc/STATUS.md'); text = p.read_text()
          old = '実ブラウザ検証は未完了です。'
          assert text.count(old) == 1
          text = text.replace(old, 'Chromium 141.0.7390.37で砲撃11群を含む全115チェック群が成功し、画面例外・HTTP失敗は0です。1440px／390pxの砲撃パネル・損害予測・ボタンを目視確認しました。[検証概要](../assets/qa/city-bombardment-summary-2026-10-30.json)。')
          p.write_text(text)
          p = Path('doc/CITY_BOMBARDMENT.md'); text = p.read_text()
          old = '画像の目視確認は別途記録します。'
          assert text.count(old) == 1
          text = text.replace(old, '1440px／390pxの画面画像を目視し、砲撃対象・損害予測・実行ボタン・説明が読み取れることと横はみ出しがないことを確認しました。ソースは実ブラウザ検証時から変更していません。')
          p.write_text(text)
          count = 0
          for folder in ['doc','wiki']:
              for source in Path(folder).rglob('*.md'):
                  for target in re.findall(r'\]\(([^)]+)\)', source.read_text()):
                      if target.startswith(('#','https:','http:','mailto:','data:')): continue
                      path = unquote(target.split('#')[0])
                      if not path: continue
                      assert (source.parent/path).exists(), (str(source), target)
                      count += 1
          baseline = Path('doc/SPECIFICATION.md').read_text().split('\n## 1.',1)[-1]
          import subprocess
          before = subprocess.check_output(['git','show','b1368044c0a14f5989a0634b42919d5ad4b39b88:doc/SPECIFICATION.md']).decode().split('\n## 1.',1)[-1]
          assert baseline == before
          review = {'verifiedAt':datetime.now(timezone.utc).isoformat(),'browserWorkflowRunId':'41014553493','testedSourceRevision':result['testedRevision'],'nodeTests':297,'syntaxFiles':102,'relativeMarkdownLinks':count,'targetSpecificationBodyUnchanged':True,'visualReview':{'viewports':[1440,390],'files':['city-bombardment/bombardment-wide.png','city-bombardment/bombardment-panel.png','city-bombardment/bombardment-mobile.png'],'reviewed':True,'observations':'Target selection, damage forecast, attack button and rules are readable; no horizontal overflow.'}}
          Path('assets/qa/city-bombardment-final-review-2026-10-30.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(review,ensure_ascii=False,indent=2))
          PY
          git diff --check
          git rm .github/bombardment-transfer/part-01.xz .github/bombardment-transfer/part-02.xz .github/bombardment-transfer/part-03.xz
          git add doc/STATUS.md doc/CITY_BOMBARDMENT.md assets/qa/city-bombardment-final-review-2026-10-30.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize city bombardment QA and remove transfer payloads'
          git push origin HEAD:refs/heads/codex/city-bombardment-20261030
