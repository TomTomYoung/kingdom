name: AI expansion integration verification
on:
  push:
    branches: ['codex/ai-expansion-20261101']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  finalize:
    if: github.ref == 'refs/heads/codex/ai-expansion-20261101'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve verified source and rerun regressions
        run: |
          git fetch --no-tags --depth=1 origin 735bf389e9dad7c85707ddfddfce483c4450ca44 7da210f663fe9c1d49af81138ce12746682a1c93
          git diff --exit-code 735bf389e9dad7c85707ddfddfce483c4450ca44 HEAD -- src tests tools index.html
          git diff --exit-code 7da210f663fe9c1d49af81138ce12746682a1c93 HEAD -- doc/SPECIFICATION.md assets ':!assets/qa'
          npm run check | tee "$RUNNER_TEMP/expansion-syntax.log"
          npm test | tee "$RUNNER_TEMP/expansion-node.log"
      - name: Finalize documentation and observed image review
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, os, re
          changes = {
            'doc/AI_SCENARIOS.md': [('都市建設、城壁と3研究施設以外の建物・領土の購入、範囲や狙い撃ちの選択、配置・護衛の再設定、撤退、戦略評価は後続です。','新規版では護衛付きの都市建設と、その開拓部隊の配置・護衛・限定的な退避を追加しました。城壁と3研究施設以外の建物・領土の購入、範囲や狙い撃ちの選択、一般戦闘部隊の配置・護衛の再設定、高度な撤退・戦略評価は後続です。')],
            'doc/AI_INFRASTRUCTURE.md': [('次の候補は都市拡張AIです。既存FoundCityの距離・所有権・移動力・護衛維持を共用し、開拓者・護衛の確保と建設地点評価を段階的に接続します。現時点では開拓AI、正式研究木、汎用Ability、mana用途、Dungeon、Domination全体は未実装です。','都市拡張AIは後続工程で実装しました。新規aiExpansionVersion 1では緊急城壁の後・施設投資の前に開拓者調達を判定します。[開拓・護衛・経路の条件](AI_EXPANSION.md)。正式研究木、汎用Ability、mana用途、Dungeon、Domination全体は未実装です。')],
            'doc/README.md': [('都市拡張・3研究施設と城壁以外の建物の戦略AI、Domination、Dungeonは未実装です。','新規版では護衛付き都市拡張AIも利用できます。3研究施設と城壁以外の建物の戦略AI、Domination全体、Dungeonは未実装です。'),('次の候補は都市拡張AIです。','[都市拡張AI](AI_EXPANSION.md)も新規版に追加しました。次の候補は最小限の能動Abilityです。')],
            'doc/STATUS.md': [('次の候補は都市拡張AIです。','都市拡張AIも実装済みです。次の候補は最小限の能動Abilityです。')]
          }
          for name, pairs in changes.items():
              p=Path(name); text=p.read_text()
              for old,new in pairs:
                  assert old in text,(name,old)
                  text=text.replace(old,new)
              p.write_text(text)
          for name in ['doc/AI_EXPANSION.md','doc/STATUS.md']:
              p=Path(name); text=p.read_text().replace('画像の目視確認は別途記録します。','1440px／390pxの画像を目視確認し、開拓方針・都市数・建設履歴に欠けや横はみ出しがないことを確認しました。')
              p.write_text(text)
          p=Path('doc/AI_EXPANSION.md')
          p.write_text(p.read_text()+'\n最終整理では検証済み735bf38からゲーム実装・テスト・ブラウザQAを変更せず、Node回帰を再実行しました。[最終確認](../assets/qa/ai-expansion-final-review-2026-11-01.json)。一時統合ヘルパーと書込み権限付き検証ワークフローはマージ前に削除し、既存の読取り専用Node CIを維持します。\n')
          Path('tools/qa/stage-ai-expansion.py').unlink()
          root=Path(os.environ['RUNNER_TEMP'])
          node=(root/'expansion-node.log').read_text(); tests=int(re.search(r'# tests (\d+)',node)[1]); passed=int(re.search(r'# pass (\d+)',node)[1]); failed=int(re.search(r'# fail (\d+)',node)[1]); assert tests==passed and failed==0
          syntax=int(re.search(r'Syntax checked (\d+) JavaScript files',(root/'expansion-syntax.log').read_text())[1])
          report={'verifiedAt':datetime.now(timezone.utc).isoformat(),'browserWorkflowRunId':'41220771966','testedSourceRevision':'735bf389e9dad7c85707ddfddfce483c4450ca44','nodeTests':tests,'syntaxFiles':syntax,'targetSpecificationUnchanged':True,'nonQaAssetsUnchanged':True,'temporaryIntegrationHelperRemoved':True,'visualReview':{'viewports':[1440,390],'files':['ai-expansion/expansion-wide.png','ai-expansion/expansion-panel.png','ai-expansion/expansion-mobile.png'],'reviewed':True,'observations':'Expansion policy, founded-city count and AI activity are readable without clipping or horizontal overflow.'}}
          dest=Path('assets/qa/ai-expansion-final-review-2026-11-01.json'); dest.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          count=0
          for folder in ['doc','wiki']:
              for p in Path(folder).rglob('*.md'):
                  for href in re.findall(r'\]\(([^)]+)\)',p.read_text()):
                      href=href.split('#')[0]
                      if not href or '://' in href or href.startswith('mailto:'): continue
                      assert (p.parent/href).exists(),(str(p),href)
                      count+=1
          report['relativeMarkdownLinks']=count; dest.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n');print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- doc tools/qa
          git add assets/qa/ai-expansion-final-review-2026-11-01.json
          git commit -m 'docs: finalize expansion verification and current implementation records'
          git push origin HEAD:refs/heads/codex/ai-expansion-20261101
