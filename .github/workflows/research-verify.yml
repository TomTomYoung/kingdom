name: Research integration verification
on:
  push:
    branches: ['codex/research-20261031']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  finalize:
    if: github.ref == 'refs/heads/codex/research-20261031'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve the tested implementation and rerun regressions
        run: |
          git fetch --no-tags --depth=1 origin c54988da3ce05597599b7716ec5760bc85a0c3c1 009e5841fe5bb41f3230b8fd3b8547cbba18b0d5
          git diff --exit-code c54988da3ce05597599b7716ec5760bc85a0c3c1 HEAD -- src tests tools index.html
          npm run check | tee "$RUNNER_TEMP/research-syntax.log"
          npm test | tee "$RUNNER_TEMP/research-node.log"
      - name: Reproduce complete single-city research and construction runs
        run: |
          node --input-type=module <<'JS' > assets/qa/research-playthrough-2026-10-31.json
          import assert from 'node:assert/strict';
          import { createInitialGameState, restoreGameState, serializeGameState } from './src/core/game-state.js';
          import { HumanController } from './src/core/human-controller.js';
          import { RuleSystem } from './src/core/rule-system.js';
          import { researchSelectionError, itemResearchError, unassignedScience } from './src/systems/research-system.js';
          import { RULESET } from './src/core/ruleset.js';
          const c=new HumanController('kingdom-1'); let commands=0,saves=0; const games=[];
          for (let seed=1;seed<=12;seed++) {
            let s=createInitialGameState(seed,{startingParty:true});
            function exec(command){const r=RuleSystem.execute(s,command);assert.equal(r.ok,true,r.reason);s=r.state;commands++;assert.deepEqual(restoreGameState(serializeGameState(s)),s);saves++;}
            exec(c.startTurn(s));
            for(let i=0;i<80;i++){
              if(!s.kingdoms[c.playerId].research.currentTechnologyId){const next=['writing','engineering','agriculture'].find(id=>!researchSelectionError(s,c.playerId,id));if(next)exec(c.selectResearch(s,next));}
              for(const id of ['library','workshop','granary']){
                const city=s.cities['city-1'];if(city.buildings.includes(id)||itemResearchError(s,c.playerId,id))continue;
                if(s.kingdoms[c.playerId].stockpiles.gold>=RULESET.items[id].purchaseOptions.gold)exec(c.purchaseItem(s,city.id,id));
                else if(!city.production.currentItemId)exec(c.setProduction(s,city.id,id));
              }
              exec(c.endTurn(s));assert.ok(unassignedScience(s.kingdoms[c.playerId])>=0);
            }
            assert.equal(s.kingdoms[c.playerId].research.completedTechnologyIds.length,3);assert.equal(s.cities['city-1'].buildings.length,3);
            games.push({seed,turn:s.currentTurn,completed:s.kingdoms[c.playerId].research.completedTechnologyIds,buildings:s.cities['city-1'].buildings});
          }
          console.log(JSON.stringify({verifiedAt:new Date().toISOString(),kind:'additional bounded single-city playthrough',roundsPerSeed:80,commands,saveRoundTrips:saves,games},null,2));
          JS
      - name: Finalize documentation, visual review and source links
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.parse
          from pathlib import Path
          from datetime import datetime, timezone
          summary=json.loads(Path('assets/qa/research-summary-2026-10-31.json').read_text())
          assert summary['browserCheckGroups']==127 and not summary['pageErrors'] and not summary['httpFailures']
          old='1440px／390pxの画面画像を検証成果物に保存しました。目視確認は別途記録します。'
          new='1440px／390pxの画面画像を目視確認し、研究選択・費用・前提・解禁先・ボタンに欠けや横はみ出しがないことを確認しました。'
          for name in ['doc/RESEARCH.md','doc/STATUS.md']:
              p=Path(name); text=p.read_text(); assert old in text or new in text; p.write_text(text.replace(old,new))
          p=Path('doc/RESEARCH.md'); text=p.read_text()
          note='追加で12シード×80ターンの単一都市運営を実行し、全研究・全施設の完成と1,046回のCommand・保存復元を確認しました。[運営検証](../assets/qa/research-playthrough-2026-10-31.json)・[最終確認](../assets/qa/research-final-review-2026-10-31.json)。初回のブラウザ検証は研究完了通知をセーブ操作の後に確認していたため失敗し、操作順序だけを修正して全127群を再検証しました。ゲームの保存検証条件は緩めていません。\n\n'
          if note not in text: text=text.replace('研究対象は3件の暫定定義です。',note+'研究対象は3件の暫定定義です。')
          text=text.replace('正規の都市占領で取得した施設は研究未完でも許可します。','小数産出では加算順による1e-9以内の丸め差だけを許容し、過剰な配分は拒否します。正規の都市占領で取得した施設は研究未完でも許可します。')
          p.write_text(text)
          for i in range(1,5): Path(f'.github/research-transfer/part-{i:02}.xz').unlink()
          baseline='009e5841fe5bb41f3230b8fd3b8547cbba18b0d5'
          assert Path('doc/SPECIFICATION.md').read_bytes()==subprocess.check_output(['git','show',baseline+':doc/SPECIFICATION.md'])
          def assets(ref):
              rows=subprocess.check_output(['git','ls-tree','-r',ref,'--','assets']).decode().splitlines()
              return [r for r in rows if not r.split('\t')[1].startswith('assets/qa/')]
          assert assets(baseline)==assets('HEAD')
          log=Path(os.environ['RUNNER_TEMP'],'research-node.log').read_text()
          tests=int(re.search(r'# tests (\d+)',log)[1]);passed=int(re.search(r'# pass (\d+)',log)[1]);failed=int(re.search(r'# fail (\d+)',log)[1]);assert tests==passed and failed==0
          syntax=int(re.search(r'Syntax checked (\d+) JavaScript files',Path(os.environ['RUNNER_TEMP'],'research-syntax.log').read_text())[1])
          result={'verifiedAt':datetime.now(timezone.utc).isoformat(),'browserWorkflowRunId':'41169644255','testedSourceRevision':'c54988da3ce05597599b7716ec5760bc85a0c3c1','nodeTests':tests,'syntaxFiles':syntax,'targetSpecificationUnchanged':True,'nonQaAssetsUnchanged':True,'temporaryTransferFilesRemoved':True,'visualReview':{'viewports':[1440,390],'files':['research/research-wide.png','research/research-panel.png','research/research-mobile.png'],'reviewed':True,'observations':'Research target selection, science budget, prerequisites, unlocks and controls are readable without horizontal overflow.'}}
          dest=Path('assets/qa/research-final-review-2026-10-31.json');dest.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          count=0
          for p in list(Path('doc').rglob('*.md'))+list(Path('wiki').rglob('*.md')):
              for target in re.findall(r'\]\(([^)]+)\)',p.read_text()):
                  target=target.strip().split(' ')[0]
                  if re.match(r'^[a-z]+:',target) or target.startswith('#'):continue
                  target=urllib.parse.unquote(target.split('#')[0]); count+=1
                  assert (p.parent/target).exists(), (str(p),target)
          result['relativeMarkdownLinks']=count;dest.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n');print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- doc/RESEARCH.md doc/STATUS.md .github/research-transfer
          git add assets/qa/research-playthrough-2026-10-31.json assets/qa/research-final-review-2026-10-31.json
          git commit -m 'docs: finalize research QA, visual review and implementation handoff'
          git push origin HEAD:refs/heads/codex/research-20261031
