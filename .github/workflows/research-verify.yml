name: Research integration verification
on:
  push:
    branches: ['codex/research-20261031']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: kingdom-research-integration
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/codex/research-20261031'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 009e5841fe5bb41f3230b8fd3b8547cbba18b0d5
          path: .qa-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check completion notification before the save notification
        run: |
          mkdir -p "$RUNNER_TEMP/kingdom-reports"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/qa/browser-research.mjs'); s=p.read_text()
          old="await load(near); await click('#end-turn'); const unlocked = await save();\n  assert.deepEqual(unlocked.kingdoms['kingdom-1'].research.completedTechnologyIds, ['writing']);\n  assert.match(await page.locator('#message').innerText(), /研究完了.*文字/);"
          new="await load(near); await click('#end-turn');\n  assert.match(await page.locator('#message').innerText(), /研究完了.*文字/);\n  const unlocked = await save();\n  assert.deepEqual(unlocked.kingdoms['kingdom-1'].research.completedTechnologyIds, ['writing']);"
          assert old in s or new in s
          p.write_text(s.replace(old,new))
          PY
      - name: Syntax, Node regressions and historical save continuation
        run: |
          npm run check | tee "$RUNNER_TEMP/kingdom-reports/syntax.log"
          npm test | tee "$RUNNER_TEMP/kingdom-reports/node.log"
          node tools/qa/save-research-compat.mjs .qa-baseline assets/qa/save-research-compat-2026-10-31.json | tee "$RUNNER_TEMP/kingdom-reports/compat.log"
      - name: Commit verified test correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/qa/browser-research.mjs assets/qa/save-research-compat-2026-10-31.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: verify research completion notification before saving'
            git push origin HEAD:refs/heads/codex/research-20261031
          fi
          echo "KINGDOM_TESTED_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Install isolated browser QA runtime
        run: |
          mkdir -p "$RUNNER_TEMP/kingdom-qa"
          printf '{"private":true}\n' > "$RUNNER_TEMP/kingdom-qa/package.json"
          npm install --prefix "$RUNNER_TEMP/kingdom-qa" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/kingdom-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "KINGDOM_QA_MODULES=$RUNNER_TEMP/kingdom-qa" >> "$GITHUB_ENV"
      - name: Verify research and all existing browser regressions
        run: |
          for suite in research city-bombardment production-queue party-care city-defense siege conquest ai cities ranged founding reorganization; do
            node "tools/qa/browser-$suite.mjs" "$RUNNER_TEMP/kingdom-reports/$suite" 2>&1 | tee "$RUNNER_TEMP/kingdom-reports/$suite.log"
            report="$RUNNER_TEMP/kingdom-reports/$suite/report.json"
            if [ ! -f "$report" ]; then cp "$RUNNER_TEMP/kingdom-reports/$suite/results.json" "$report"; fi
            cp "$report" "assets/qa/browser-research-$suite-2026-10-31.json"
          done
      - name: Record actual verification results
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone
          root = Path(os.environ['RUNNER_TEMP'])/'kingdom-reports'
          suites = ['research','city-bombardment','production-queue','party-care','city-defense','siege','conquest','ai','cities','ranged','founding','reorganization']
          reports = {s:json.loads((root/s/'report.json').read_text()) for s in suites}
          for report in reports.values():
              for field in ['error','pageErrors','httpFailures','errors','failures']: assert not report.get(field), report
              assert isinstance(report['checks'],list) and report['checks'], report
          counts = {s:len(r['checks']) for s,r in reports.items()}
          log = (root/'node.log').read_text()
          tests = int(re.search(r'# tests (\d+)',log)[1]); passed = int(re.search(r'# pass (\d+)',log)[1]); failed = int(re.search(r'# fail (\d+)',log)[1])
          assert tests == passed and failed == 0
          syntax = int(re.search(r'Syntax checked (\d+) JavaScript files',(root/'syntax.log').read_text())[1])
          compat = json.loads(Path('assets/qa/save-research-compat-2026-10-31.json').read_text())
          result = {'verifiedAt':datetime.now(timezone.utc).isoformat(),'baselineRevision':'009e5841fe5bb41f3230b8fd3b8547cbba18b0d5','workflowRunId':os.environ['GITHUB_RUN_ID'],'testedRevision':os.environ['KINGDOM_TESTED_REVISION'],'browser':reports['research']['browser'],'nodeTests':tests,'syntaxFiles':syntax,'saveSnapshots':compat['snapshots'],'continuationCommands':compat['continuationCommands'],'browserCheckGroups':sum(counts.values()),'suites':counts,'pageErrors':[],'httpFailures':[]}
          Path('assets/qa/research-summary-2026-10-31.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          note=f"Chromium {result['browser']}で全{result['browserCheckGroups']}チェック群が成功しました。研究{counts['research']}群と既存の都市砲撃・生産キュー・休養・都市反撃・攻城・占領・AI・都市・遠隔・開拓・再編を含み、画面例外・HTTP失敗は0です。[検証概要](../assets/qa/research-summary-2026-10-31.json)。1440px／390pxの画面画像を検証成果物に保存しました。目視確認は別途記録します。"
          p=Path('doc/RESEARCH.md'); p.write_text(p.read_text().replace('実ブラウザ検証は未完了です。結果を確認してから更新します。',note))
          p=Path('doc/STATUS.md'); p.write_text(p.read_text().replace('実ブラウザ検証は未完了です。',note))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          git add assets/qa/browser-research-*-2026-10-31.json assets/qa/research-summary-2026-10-31.json doc/RESEARCH.md doc/STATUS.md
          git commit -m 'test: record research browser and historical save verification'
          git push origin HEAD:refs/heads/codex/research-20261031
      - name: Package exact tested source
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/kingdom-reports"
          git archive --format=tar.gz -o "$RUNNER_TEMP/kingdom-reports/kingdom-tested-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kingdom-research-verification
          path: ${{ runner.temp }}/kingdom-reports
          retention-days: 7
