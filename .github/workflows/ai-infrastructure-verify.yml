name: AI infrastructure integration verification
on:
  push:
    branches: ['codex/ai-infrastructure-20261101']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  finalize:
    if: github.ref == 'refs/heads/codex/ai-infrastructure-20261101'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve verified implementation and rerun regressions
        run: |
          git fetch --no-tags --depth=1 origin e54a48addb98c8e90ee51fe8e932e9f048056080 3ffac57429050908fe120fef81d896770f7499f1
          git diff --exit-code e54a48addb98c8e90ee51fe8e932e9f048056080 HEAD -- src tests tools index.html
          npm run check | tee "$RUNNER_TEMP/final-syntax.log"
          npm test | tee "$RUNNER_TEMP/final-node.log"
      - name: Finalize documentation, observed screenshots and source links
        run: |
          git rm -r -- .github/ai-infrastructure-transfer
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from datetime import datetime, timezone
          from urllib.parse import unquote
          baseline='3ffac57429050908fe120fef81d896770f7499f1'
          tested='e54a48addb98c8e90ee51fe8e932e9f048056080'
          before=subprocess.check_output(['git','show',baseline+':doc/SPECIFICATION.md'],text=True)
          after=Path('doc/SPECIFICATION.md').read_text()
          assert before.split('## 1. ゲームの定義',1)[1] == after.split('## 1. ゲームの定義',1)[1]
          asset_changes=subprocess.check_output(['git','diff','--name-only',baseline,'HEAD','--','assets'],text=True).splitlines()
          assert all(path.startswith('assets/qa/') for path in asset_changes), asset_changes
          for name in ['doc/AI_INFRASTRUCTURE.md','doc/STATUS.md']:
              p=Path(name); text=p.read_text().replace('1440px／390pxの画面画像は検証成果物に保存し、目視確認は別途記録します。','1440px／390pxの画面画像を目視確認し、投資条件と施設別行動履歴が欠けや横はみ出しなく表示されることを確認しました。[最終確認](../assets/qa/ai-infrastructure-final-review-2026-11-01.json)。'); p.write_text(text)
          p=Path('doc/AI_INFRASTRUCTURE.md'); text=p.read_text(); text += '\n初回ブラウザ検証では、戦闘不能者のfixtureに未定義のincapacitatedを使ったため保存検証が正しく拒否しました。既存モデルのshatteredにテストデータだけを直し、ゲームの保存検証を緩めずに全136群を再検証しました。検証済みソースから実装を変更せず、最終整理でも全355テストを再実行しています。この工程の最終差分には一時転送ファイルと書込み権限付き検証ワークフローを含めません。\n'; p.write_text(text)
          report_path=Path('assets/qa/ai-infrastructure-final-review-2026-11-01.json')
          node=Path(os.environ['RUNNER_TEMP'],'final-node.log').read_text()
          tests=int(re.search(r'# tests (\d+)',node)[1]); passed=int(re.search(r'# pass (\d+)',node)[1]); failed=int(re.search(r'# fail (\d+)',node)[1]); assert tests==passed and failed==0
          syntax=int(re.search(r'Syntax checked (\d+) JavaScript files',Path(os.environ['RUNNER_TEMP'],'final-syntax.log').read_text())[1])
          result={'verifiedAt':datetime.now(timezone.utc).isoformat(),'browserWorkflowRunId':'41216530488','testedSourceRevision':tested,'nodeTests':tests,'syntaxFiles':syntax,'targetSpecificationBodyUnchanged':True,'nonQaAssetsUnchanged':True,'temporaryTransferFilesRemoved':True,'visualReview':{'viewports':[1440,390],'files':['ai-infrastructure/ai-investment-wide.png','ai-infrastructure/ai-investment-panel.png','ai-infrastructure/ai-investment-mobile.png'],'reviewed':True,'observations':'Investment conditions and named facility activity are readable without clipping or horizontal overflow.'}}
          report_path.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          count=0
          for p in [*Path('doc').rglob('*.md'),*Path('wiki').rglob('*.md')]:
              for raw in re.findall(r'\]\(([^)]+)\)',p.read_text()):
                  target=raw.split('#')[0].split(' ')[0]
                  if not target or re.match(r'^[a-zA-Z]+:',target) or target.startswith('/'): continue
                  count+=1; assert (p.parent/unquote(target)).exists(), (str(p),target)
          result['relativeMarkdownLinks']=count; report_path.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/AI_INFRASTRUCTURE.md doc/STATUS.md assets/qa/ai-infrastructure-final-review-2026-11-01.json
          git commit -m 'docs: finalize AI investment QA and visual review without changing tested source'
          git push origin HEAD:refs/heads/codex/ai-infrastructure-20261101
