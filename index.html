<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kingdom — M1</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <header><div><span class="eyebrow">KINGDOM / M1</span><h1>黎明王国</h1></div><div class="turn"><small>現在のターン</small><strong id="turn">1</strong></div></header>
  <main>
    <section class="map-panel"><div class="panel-title"><h2>王領地図</h2><span id="seed"></span></div><canvas id="map" aria-label="六角形の王領地図"></canvas><p class="hint">未所有の隣接タイルを選択すると、Goldで購入できます。</p></section>
    <aside>
      <section class="card resources"><h2>国庫と進捗</h2><div id="resources" class="stat-grid"></div><div id="derived" class="derived"></div></section>
      <section class="card"><div class="city-heading"><div><small>首都</small><h2 id="city-name"></h2></div><span id="population"></span></div><div id="yields" class="yield-row"></div><div class="progress-label"><span>食料</span><span id="food-label"></span></div><div class="bar"><i id="food-bar"></i></div><div class="progress-label"><span>領土文化</span><span id="culture-label"></span></div><div class="bar culture"><i id="culture-bar"></i></div></section>
      <section class="card"><h2>都市生産</h2><div id="production-status" class="production-status"></div><div class="actions"><button data-produce="warrior">戦士を生産</button><button data-buy="warrior" class="secondary">戦士を購入 · 48</button><button data-produce="monument">モニュメントを生産</button><button data-buy="monument" class="secondary">建物を購入 · 80</button></div></section>
      <section class="card"><h2>Party</h2><div id="party-status" class="production-status"></div><button id="form-party" class="secondary">未編成のUnitからPartyを作成</button><p class="hint">Partyを選択後、隣接タイルをクリックして移動します。</p></section>
      <button id="end-turn" class="end-turn">ターンを終了 <span>→</span></button>
      <div class="save-actions"><button id="save">セーブ</button><button id="load">ロード</button><button id="reset">新規開始</button></div>
      <p id="message" role="status"></p>
    </aside>
  </main>
  <script type="module" src="/src/ui/main.js"></script>
</body>
</html>
