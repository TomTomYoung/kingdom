        class SceneManager {
            constructor(game) {

            switchTo(sceneName, data = {}) {
                this.game.scene.start(sceneName, data);

        class EventManager {
            constructor() {
                this.eventEmitter = new Phaser.Events.EventEmitter();
            }

            on(event, callback, context) {
                this.eventEmitter.on(event, callback, context);
            }

            emit(event, ...args) {
                this.eventEmitter.emit(event, ...args);
            }
        }

        class GUIManager {
            constructor(scene) {
                this.scene = scene;
                this.elements = {};
            }

            addElement(key, element) {
                this.elements[key] = element;
            }

            updateElement(key, props) {
                if (this.elements[key]) {
                    Object.assign(this.elements[key], props);
                }
            }

            removeElement(key) {
                if (this.elements[key]) {
                    this.elements[key].destroy();
                    delete this.elements[key];
                }
            }
        }

        class DataManager {
            constructor() {
                this.data = {};
                this.resourceNameMap = {}; // リソース名のマッピング（英語名から日本語名）
            }

            loadJSON(key, jsonString) {
                try {
                    this.data[key] = JSON.parse(jsonString);

                    // リソースデータの場合、マッピングを作成
                    if (key === 'resources') {
                        this.data[key].resources.forEach(resource => {
                            this.resourceNameMap[resource.name] = resource.japaneseName;
                        });
                    }
                } catch (error) {
                    console.error(`Error parsing JSON for key ${key}:`, error);
                }
            }

            get(key) {
                return this.data[key];
            }

            getResourceJapaneseName(englishName) {
                return this.resourceNameMap[englishName] || englishName;
            }
        }

        //#region Hex

        class Hex {
            constructor(q, r, s) {
                this.q = q;
                this.r = r;
                this.s = s;
                if (Math.round(q + r + s) !== 0) {
                    console.warn("Warning: q + r + s is not 0. Adjusting s to ensure q + r + s = 0.");
                    this.s = -q - r;
                }
                this.edges = new Map();
            }

            add(b) {
                return new Hex(this.q + b.q, this.r + b.r, this.s + b.s);
            }

            subtract(b) {
                return new Hex(this.q - b.q, this.r - b.r, this.s - b.s);
            }

            equals(other) {
                return this.q === other.q && this.r === other.r && this.s === other.s;
            }

            toString() {
                return `${this.q},${this.r},${this.s}`;
            }

            static fromString(str) {
                const [q, r, s] = str.split(',').map(Number);
                return new Hex(q, r, s);
            }

            // エッジを追加するメソッド
            addEdge(direction, type) {
                this.edges.set(direction, type);
            }

            // エッジの種類を取得するメソッド
            getEdge(direction) {
                return this.edges.get(direction);
            }

            // 隣接するヘックスの方向を取得するメソッド
            static directions = [
                new Hex(1, -1, 0), new Hex(1, 0, -1), new Hex(0, 1, -1),
                new Hex(-1, 1, 0), new Hex(-1, 0, 1), new Hex(0, -1, 1)
            ];

            // 隣接するヘックスを取得するメソッド
            neighbor(direction) {
                return this.add(Hex.directions[direction]);
            }
        }

        class Layout {
            constructor(orientation, size, origin) {
                this.orientation = orientation;
                this.size = size;
                this.origin = origin;
            }

            hexToPixel(h) {
                let M = this.orientation;
                let size = this.size;
                let origin = this.origin;
                let x = (M.f0 * h.q + M.f1 * h.r) * size.x;
                let y = (M.f2 * h.q + M.f3 * h.r) * size.y;
                return {x: x + origin.x, y: y + origin.y};
            }

            pixelToHex(p) {
                let M = this.orientation;
                let size = this.size;
                let origin = this.origin;
                let pt = {x: (p.x - origin.x) / size.x, y: (p.y - origin.y) / size.y};
                let q = M.b0 * pt.x + M.b1 * pt.y;
                let r = M.b2 * pt.x + M.b3 * pt.y;
                return new Hex(q, r, -q-r);
            }
        }

        const layout_pointy = {
            f0: Math.sqrt(3.0), f1: Math.sqrt(3.0) / 2.0, f2: 0.0, f3: 3.0 / 2.0,
            b0: Math.sqrt(3.0) / 3.0, b1: -1.0 / 3.0, b2: 0.0, b3: 2.0 / 3.0,
            start_angle: 0.5
        };

        class PriorityQueue {
            constructor() {
                this.elements = [];
            }

            enqueue(element, priority) {
                this.elements.push({element, priority});
                this.elements.sort((a, b) => a.priority - b.priority);
            }

            dequeue() {
                return this.elements.shift().element;
            }

            isEmpty() {
                return this.elements.length === 0;
            }

            includes(element) {
                return this.elements.some(e => e.element === element);
            }
        }

        Hex.prototype.toString = function() {
            return `${this.q},${this.r},${this.s}`;
        };

        Hex.fromString = function(str) {
            const [q, r, s] = str.split(',').map(Number);
            return new Hex(q, r, s);
        };

        class Layer {
            constructor(scene, width, height) {
                this.scene = scene;
                this.width = width;
                this.height = height;
                this.graphics = scene.add.graphics();
            }

            clear() {
                this.graphics.clear();
            }
        }

        class TileLayer extends Layer {

            constructor(scene, width, height, hexSize, dataManager, mapSize, mapBorder) {
                super(scene, width, height);
                this.hexSize = hexSize;
                this.layout = new Layout(layout_pointy, { x: hexSize, y: hexSize }, { x: width / 2, y: height / 2 });
                this.grid = {};
                this.dataManager = dataManager;
                this.mapSize = mapSize;
                this.mapBorder = mapBorder;
                this.createGrid();
            }

            createGrid() {
                const tileData = this.dataManager.get('tiles').tiles;
                const tileTypes = tileData.map(tile => tile.name);
                const maxCoord = Math.floor(this.mapSize / 2);

                for (let q = -maxCoord - this.mapBorder; q <= maxCoord + this.mapBorder; q++) {
                    for (let r = -maxCoord - this.mapBorder; r <= maxCoord + this.mapBorder; r++) {
                        let s = -q - r;
                        let hex = new Hex(q, r, s);
                        let key = `${q},${r},${s}`;

                        if (Math.abs(q) > maxCoord || Math.abs(r) > maxCoord || Math.abs(s) > maxCoord) {
                            // マップの外周を "無" タイルで埋める
                            this.grid[key] = new Tile(q, r, s, 'Void', tileData, this.dataManager);
                        } else {
                            let type = Phaser.Math.RND.pick(tileTypes);
                            this.grid[key] = new Tile(q, r, s, type, tileData, this.dataManager);
                        }

                        // ランダムにエッジを追加（例として）
                        for (let i = 0; i < 6; i++) {
                            if (Math.random() < 0.1) {  // 10%の確率でエッジを追加
                                hex.addEdge(i, Math.random() < 0.5 ? 'river' : 'wall');
                            }
                        }
                    }
                }
            }

            draw() {
                this.clear();
                for (let key in this.grid) {
                    let tile = this.grid[key];
                    let center = this.layout.hexToPixel(tile.hex);
                    this.drawHexagon(center.x, center.y, this.hexSize, this.getColorForTile(tile));
                    this.drawText(center.x, center.y, tile.getJapaneseType());
                }
            }
            getColorForTile(tile) {
                switch(tile.type) {
                    case 'Grassland': return 0x7CFC00;
                    case 'Forest': return 0x228B22;
                    case 'Hill': return 0x8B4513;
                    case 'Sea': return 0x1E90FF;
                    default: return 0xCCCCCC;
                }
            }

            drawHexagon(x, y, size, color) {
                this.graphics.lineStyle(2, 0x000000, 1);
                this.graphics.fillStyle(color, 1);
                this.graphics.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = 2 * Math.PI / 6 * (i + 0.5);
                    const hx = x + size * Math.cos(angle);
                    const hy = y + size * Math.sin(angle);
                    if (i === 0) {
                        this.graphics.moveTo(hx, hy);
                    } else {
                        this.graphics.lineTo(hx, hy);
                    }
                }
                this.graphics.closePath();
                this.graphics.fillPath();
                this.graphics.strokePath();
            }

            drawText(x, y, text) {
                this.scene.add.text(x, y, text, { fontSize: '16px', fill: '#000' }).setOrigin(0.5);
            }

            getHexAt(x, y) {
                let hex = this.layout.pixelToHex({x: x, y: y});
                hex.q = Math.round(hex.q);
                hex.r = Math.round(hex.r);
                hex.s = Math.round(hex.s);
                let key = `${hex.q},${hex.r},${hex.s}`;
                return this.grid[key];
            }
        }


        class BuildingLayer extends Layer {
            constructor(scene, width, height, hexSize) {
                super(scene, width, height);
                this.hexSize = hexSize;
                this.layout = new Layout(layout_pointy, {x: hexSize, y: hexSize}, {x: width/2, y: height/2});
                this.buildings = [];
            }

            addBuilding(hex, buildingType) {
                let center = this.layout.hexToPixel(hex);
                this.buildings.push({
                    hex: hex,
                    x: center.x,
                    y: center.y,
                    type: buildingType
                });
            }

            draw() {
                this.clear();
                this.buildings.forEach(building => {
                    this.scene.add.text(building.x, building.y, building.type[0], { fontSize: '20px', fill: '#00ff00' }).setOrigin(0.5);
                });
            }
        }

        class CharacterLayer extends Layer {
            constructor(scene, width, height, hexSize) {
                super(scene, width, height);
                this.hexSize = hexSize;
                this.layout = new Layout(layout_pointy, {x: hexSize, y: hexSize}, {x: width/2, y: height/2});
                this.characters = [];
                this.characterSprites = []; // キャラクターのスプライトを保持する配列
                this.createCharacters();
            }

            createCharacters() {
                for (let i = 0; i < 3; i++) {
                    let q = Phaser.Math.Between(-5, 5);
                    let r = Phaser.Math.Between(-5, 5);
                    let s = -q - r;
                    let hex = new Hex(q, r, s);
                    let center = this.layout.hexToPixel(hex);
                    this.characters.push({
                        hex: hex,
                        x: center.x,
                        y: center.y,
                        type: 'P' // Player character
                    });
                }
            }

            draw() {
                // 既存のスプライトをすべて削除
                this.characterSprites.forEach(sprite => sprite.destroy());
                this.characterSprites = [];

                // キャラクターを再描画
                this.characters.forEach(char => {
                    let sprite = this.scene.add.text(char.x, char.y, char.type, { fontSize: '24px', fill: '#ff0000' }).setOrigin(0.5);
                    this.characterSprites.push(sprite);
                });
            }

            getCharacterAt(x, y) {
                let hex = this.layout.pixelToHex({x: x, y: y});
                hex.q = Math.round(hex.q);
                hex.r = Math.round(hex.r);
                hex.s = Math.round(hex.s);
                return this.characters.find(char => 
                    char.hex.q === hex.q && char.hex.r === hex.r && char.hex.s === hex.s
                );
            }

            moveCharacter(character, hex) {
                character.hex = hex;
                let center = this.layout.hexToPixel(hex);
                character.x = center.x;
                character.y = center.y;
                this.draw(); // キャラクターを移動した後、レイヤーを再描画
            }
        }

        class GUILayer extends Layer {
            constructor(scene, width, height) {
                super(scene, width, height);
                this.highlightedHexes = [];
            }

            highlightHexes(hexes, color = 0xffff00, alpha = 0.3) {
                this.clear();
                this.graphics.fillStyle(color, alpha);
                hexes.forEach(hex => {
                    const center = this.scene.tileLayer.layout.hexToPixel(hex);
                    this.drawHexagon(center.x, center.y, this.scene.hexSize);
                });
                this.highlightedHexes = hexes;
            }

            drawHexagon(x, y, size) {
                this.graphics.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = 2 * Math.PI / 6 * (i + 0.5);
                    const hx = x + size * Math.cos(angle);
                    const hy = y + size * Math.sin(angle);
                    if (i === 0) {
                        this.graphics.moveTo(hx, hy);
                    } else {
                        this.graphics.lineTo(hx, hy);
                    }
                }
                this.graphics.closePath();
                this.graphics.fillPath();
            }

            clearHighlight() {
                this.clear();
                this.highlightedHexes = [];
            }
        }

        //#endregion Layer

        class Tile {
            constructor(q, r, s, type, tileData, dataManager) {
                this.hex = new Hex(q, r, s);
                this.type = type;
                this.dataManager = dataManager;
                this.resources = this.generateResources(tileData);
                this.owner = null;
                this.movementCost = type === 'Void' ? Infinity : (tileData.find(t => t.name === type)?.movementCost || 1);
            }

            generateResources(tileData) {
                const tileInfo = tileData.find(t => t.name === this.type);
                if (!tileInfo) return {};

                return tileInfo.resources.reduce((acc, resource) => {
                    acc[resource] = 1;  // リソースキーは英語名
                    return acc;
                }, {});
            }

            getJapaneseType() {
                const tileData = this.dataManager.get('tiles').tiles;
                const tileInfo = tileData.find(t => t.name === this.type);
                return tileInfo ? tileInfo.japaneseName : this.type;
            }
        }

        class Player {
            constructor(id, startingHex, dataManager) {
                this.id = id;
                this.capital = startingHex;
                this.territory = [startingHex];
                this.resources = {
                    food: 0,
                    production: 0,
                    gold: 0,
                    science: 0
                };
                this.population = 1;
                this.units = [];
                this.buildings = [];
                this.technologies = [];
                this.dataManager = dataManager;
            }

            collectResources(tiles) {
                for (const hex of this.territory) {
                    const tile = tiles[`${hex.q},${hex.r},${hex.s}`];
                    if (tile) {
                        for (const [resource, amount] of Object.entries(tile.resources)) {
                            if (this.resources.hasOwnProperty(resource)) {
                                this.resources[resource] += amount;
                            } else {
                                this.resources[resource] = amount;
                            }
                        }
                    }
                }
                // 人口から科学資源を追加
                this.resources.science += Math.floor(this.population / 2);
            }

            createUnit(type, hex) {
                if (this.resources.production >= 10) {
                    this.resources.production -= 10;
                    this.units.push(new Unit(type, hex));
                    return true;
                }
                return false;
            }

            constructBuilding(type, hex) {
                if (this.resources.production >= 20) {
                    this.resources.production -= 20;
                    this.buildings.push(new Building(type, hex));
                    return true;
                }
                return false;
            }

            research(technology) {
                if (this.resources.science >= technology.cost) {
                    this.resources.science -= technology.cost;
                    this.technologies.push(technology);
                    return true;
                }
                return false;
            }            

            growPopulation() {
                if (this.resources.food >= this.population * 2) {
                    this.resources.food -= this.population * 2;
                    this.population++;
                    return true;
                }
                return false;
            }

            expandTerritory(newHex, tiles) {
                if (!this.territory.some(hex => hex.equals(newHex))) {
                    this.territory.push(newHex);
                    const key = `${newHex.q},${newHex.r},${newHex.s}`;
                    if (tiles[key]) {
                        tiles[key].owner = this.id;
                    } else {
                        console.warn(`Tile at ${key} does not exist in the grid.`);
                    }
                }
            }

        }

            initializeLayers() {
                this.tileLayer = new TileLayer(this, this.gameWidth, this.gameHeight, this.hexSize, this.dataManager, this.mapSize, this.mapBorder);
                //this.tileLayer = new TileLayer(this, this.gameWidth, this.gameHeight, this.hexSize, this.dataManager);
                this.buildingLayer = new BuildingLayer(this, this.gameWidth, this.gameHeight, this.hexSize);
                this.characterLayer = new CharacterLayer(this, this.gameWidth, this.gameHeight, this.hexSize);
                this.guiLayer = new GUILayer(this, this.gameWidth, this.gameHeight);

                // レイヤーの描画
                this.tileLayer.draw();
                this.buildingLayer.draw();
                this.characterLayer.draw();
            }
            
            createPlayers() {
                const startingPositions = [
                    new Hex(0, 0, 0),
                    new Hex(5, -5, 0),
                    new Hex(-5, 5, 0)
                ];

                for (let i = 0; i < 3; i++) {
                    this.players.push(new Player(i, startingPositions[i], this.dataManager));
                }
            }

            createTerritories() {
                for (const player of this.players) {
                    const territorySize = 2; // 首都を中心とした周囲のリング数
                    for (let q = -territorySize; q <= territorySize; q++) {
                        for (let r = Math.max(-territorySize, -q - territorySize); r <= Math.min(territorySize, -q + territorySize); r++) {
                            const s = -q - r;
                            const hex = player.capital.add(new Hex(q, r, s));
                            player.expandTerritory(hex, this.tileLayer.grid);
                        }
                    }
                }
                this.tileLayer.draw(); // 領土を表示するために再描画
            }

            createGameObjects() {
                const resources = this.dataManager.get('resources').resources;
                const tiles = this.dataManager.get('tiles').tiles;
                const characters = this.dataManager.get('characters').characters;
                const actions = this.dataManager.get('actions').actions;

                console.log('Loaded Resources:', resources);
                console.log('Loaded Tiles:', tiles);
                console.log('Loaded Characters:', characters);
                console.log('Loaded Actions:', actions);

                // ここでリソース、タイル、キャラクター、アクションを使ってゲームオブジェクトを作成
                // 例: キャラクターの作成
                characters.forEach(charData => {
                    let q = Phaser.Math.Between(-5, 5);
                    let r = Phaser.Math.Between(-5, 5);
                    let s = -q - r;
                    let hex = new Hex(q, r, s);
                    let center = this.characterLayer.layout.hexToPixel(hex);
                    
                    this.characterLayer.characters.push({
                        hex: hex,
                        x: center.x,
                        y: center.y,
                        ...charData
                    });
                });

                // キャラクターを描画
                this.characterLayer.draw();

                // アクション関数の定義
                this.actions = {
                    attack: (subject, target, args) => {
                        console.log(`${subject.name} attacks ${target.name} with range ${args.range}`);
                        target.hp -= subject.attack;
                    },
                    wait: (subject) => {
                        console.log(`${subject.name} waits`);
                    },
                    build: (subject, target, args) => {
                        console.log(`${subject.name} builds on ${target.name}`);
                    }
                };

                // 敵プレイヤーと蛮族の配置
                this.createCharacter('敵プレイヤー', 'E');
                this.createCharacter('蛮族', 'B');

                // 建築物の配置
                this.buildingLayer.addBuilding(new Hex(0, 0, 0), '都市');
                this.buildingLayer.draw();                
            }

            setupUI() {
                // ターン終了ボタン
                this.endTurnButton = this.add.text(this.gameWidth - 100, 50, 'ターン終了', { fill: '#0f0' })
                    .setInteractive()
                    .on('pointerdown', () => this.onEndTurnButtonClick());                    

                // 現在のターン表示
                this.turnText = this.add.text(10, 10, `ターン: ${this.currentTurn}`, { fill: '#fff' });

                // 現在のプレイヤー表示
                this.playerText = this.add.text(10, 40, `プレイヤー: ${this.currentPlayer}`, { fill: '#fff' });

                // 資源表示の追加
                this.resourceText = this.add.text(10, 70, '', { fill: '#fff' });
                this.updateResourceDisplay();    
                
                this.expandButton = this.add.text(10, 100, '領土拡張', { fill: '#0f0' })
                    .setInteractive()
                    .on('pointerdown', () => this.selectedAction = 'expand');

                this.createUnitButton = this.add.text(10, 130, 'ユニット作成', { fill: '#0f0' })
                    .setInteractive()
                    .on('pointerdown', () => this.selectedAction = 'unit');

                this.buildButton = this.add.text(10, 160, '建物建設', { fill: '#0f0' })
                    .setInteractive()
                    .on('pointerdown', () => this.selectedAction = 'building');                
            }

            setupEventListeners() {
                this.input.on('pointerdown', this.handleClick, this);
                this.input.keyboard.on('keydown-SPACE', () => {
                    if (this.gameState === 'PLAYER_PHASE') {
                        this.endPlayerPhase();
                    }
                });
            }

            setupEventWindow() {
                this.eventWindow = document.getElementById('event-window');
                document.getElementById('prev-page').addEventListener('click', () => this.prevEventPage());
                document.getElementById('next-page').addEventListener('click', () => this.nextEventPage());
                document.getElementById('close-event').addEventListener('click', () => this.closeEvent());
            }

            setupDebugInfo() {
                this.debugText = this.add.text(10, this.gameHeight - 20, '', { fill: '#fff', fontSize: '12px' });
                this.input.on('pointermove', (pointer) => {
                    const hex = this.tileLayer.getHexAt(pointer.x, pointer.y);
                    if (hex) {
                        this.debugText.setText(`Hex: q=${hex.hex.q}, r=${hex.hex.r}, s=${hex.hex.s}`);
                    }
                });
            }
            
            setupCamera() {
                this.cameras.main.setBounds(0, 0, this.gameWidth, this.gameHeight);
                this.cameras.main.setZoom(1);
                this.cameras.main.centerOn(this.gameWidth / 2, this.gameHeight / 2);

                // カメラのドラッグ移動を有効にする
                this.input.on('pointermove', (pointer) => {
                    if (pointer.isDown) {
                        this.cameras.main.scrollX -= (pointer.x - pointer.prevPosition.x) / this.cameras.main.zoom;
                        this.cameras.main.scrollY -= (pointer.y - pointer.prevPosition.y) / this.cameras.main.zoom;
                    }
                });

                // マウスホイールでズーム
                this.input.on('wheel', (pointer, gameObjects, deltaX, deltaY, deltaZ) => {
                    const zoom = this.cameras.main.zoom;
                    this.cameras.main.setZoom(zoom - deltaY * 0.001);
                });
            }

            //#endregion Create

            validIndex(q, r, s) {
                const maxCoord = Math.floor(this.mapSize / 2);
                return Math.abs(q) <= maxCoord && Math.abs(r) <= maxCoord && Math.abs(s) <= maxCoord;
            }

            //#region State

            updateGameState() {
                switch (this.gameState) {
                    case 'TURN_START':
                        this.handleTurnStart();
                        break;
                    case 'PLAYER_PHASE':
                        this.handlePlayerPhase();
                        break;
                    case 'OTHER_PLAYERS_PHASE':
                        this.handleOtherPlayersPhase();
                        break;
                    case 'CPU_PHASE':
                        this.handleCPUPhase();
                        break;
                    case 'TURN_END':
                        this.handleTurnEnd();
                        break;
                }
            }         

            handleTurnStart() {
                console.log(`ターン ${this.currentTurn} 開始`);
                this.turnText.setText(`ターン: ${this.currentTurn}`);
                this.collectResources();
                
                // 人口成長を追加
                for (const player of this.players) {
                    player.growPopulation();
                }

                this.updateResourceDisplay();
                this.gameState = 'PLAYER_PHASE';
                this.updateGameState();
            }            

            handlePlayerPhase() {
                console.log(`プレイヤー ${this.currentPlayerIndex} のフェーズ`);
                this.playerText.setText(`プレイヤー: ${this.currentPlayerIndex}`);

                // プレイヤーのターン処理を追加
                this.playerTurn();
                
                // プレイヤーの入力待ち
                // プレイヤーのアクションが完了したら endPlayerPhase() を呼び出す
            }            

            endPlayerPhase() {
                this.currentPlayerIndex++;
                if (this.currentPlayerIndex >= this.players.length) {
                    this.currentPlayerIndex = 0;
                    this.currentTurn++;
                    this.gameState = 'TURN_START';
                } else {
                    this.gameState = 'PLAYER_PHASE';
                }
                this.updateGameState();
                this.updateResourceDisplay();
                this.turnText.setText(`ターン: ${this.currentTurn}`);
                this.playerText.setText(`プレイヤー: ${this.currentPlayerIndex}`);
            }            

            handleOtherPlayersPhase() {
                console.log(`プレイヤー ${this.currentPlayerIndex} のフェーズ`);
                this.playerText.setText(`プレイヤー: ${this.currentPlayerIndex}`);
                // 他のプレイヤーのターン処理
                this.enemyTurn(); // ここで呼び出す
                // 処理が完了したら自動的に次のフェーズへ
                this.currentPlayerIndex++;
                if (this.currentPlayerIndex < this.players.length - 1) {
                    this.updateGameState(); // 次のプレイヤーへ
                } else {
                    this.gameState = 'CPU_PHASE';
                    this.updateGameState();
                }
            }

            handleCPUPhase() {
                console.log('CPU のフェーズ');
                // CPU（蛮族）の処理
                this.barbarianTurn();
                this.gameState = 'TURN_END';
                this.updateGameState();
            }

            handleTurnEnd() {
                console.log(`ターン ${this.currentTurn} 終了`);
                this.currentTurn++;
                this.gameState = 'TURN_START';
                this.updateGameState();
            }            
            //#endregion State

            updateResourceDisplay() {
                const currentPlayer = this.players[this.currentPlayerIndex];
                const resourceNames = this.dataManager.get('resources').resources;

                const resourceText = resourceNames.map(resource => {
                    const englishName = resource.name;
                    const japaneseName = resource.japaneseName;
                    const amount = currentPlayer.resources[englishName] || 0;
                    return `${japaneseName}: ${amount}`;
                }).join(' | ');

                this.resourceText.setText(`プレイヤー ${currentPlayer.id} | ${resourceText} | 人口: ${currentPlayer.population}`);
            }            

            collectResources() {
                for (const player of this.players) {
                    player.collectResources(this.tileLayer.grid);
                }
            }            

            createCharacter(type, symbol, player) {
                let q, r, s;
                do {
                    q = Phaser.Math.Between(-5, 5);
                    r = Phaser.Math.Between(-5, 5);
                    s = -q - r;
                } while (Math.abs(s) > 5);  // Ensure the hex is within the map

                let hex = new Hex(q, r, s);
                let center = this.characterLayer.layout.hexToPixel(hex);
                
                this.characterLayer.characters.push({
                    hex: hex,
                    x: center.x,
                    y: center.y,
                    type: type,
                    symbol: symbol,
                    player: player
                });
            }            

            enemyTurn() {
                console.log('敵のターン');
                // 簡単なAI: ランダムに移動
                this.characterLayer.characters.forEach(char => {
                    if (char.type === '敵プレイヤー') {
                        let newHex = this.getRandomAdjacentHex(char.hex);
                        this.characterLayer.moveCharacter(char, newHex);
                    }
                });
                //this.endTurn();
            }

            barbarianTurn() {
                console.log('蛮族のターン');
                // 簡単なAI: ランダムに移動
                this.characterLayer.characters.forEach(char => {
                    if (char.type === '蛮族') {
                        let newHex = this.getRandomAdjacentHex(char.hex);
                        this.characterLayer.moveCharacter(char, newHex);
                    }
                });
                //this.endTurn();
            }

            playerTurn() {
                console.log('プレイヤーのターン');
                // ランダムにイベントを発生させる
                if (Math.random() < 0.3) {  // 30%の確率でイベント発生
                    this.triggerEvent('ancient-ruins');
                }
            }

            getRandomAdjacentHex(hex) {
                const directions = [
                    new Hex(1, -1, 0), new Hex(1, 0, -1), new Hex(0, 1, -1),
                    new Hex(-1, 1, 0), new Hex(-1, 0, 1), new Hex(0, -1, 1)
                ];
                const direction = Phaser.Math.RND.pick(directions);
                return hex.add(direction);
            }


            triggerEvent(eventId) {
                const eventData = this.dataManager.get('events').events.find(e => e.id === eventId);
                if (eventData) {
                    this.eventPages = eventData.pages;
                    this.currentEventPage = 0;
                    this.updateEventWindow();
                    this.eventWindow.style.display = 'block';
                }
            }

            updateEventWindow() {
                document.getElementById('event-text').innerText = this.eventPages[this.currentEventPage];
                document.getElementById('prev-page').disabled = this.currentEventPage === 0;
                document.getElementById('next-page').disabled = this.currentEventPage === this.eventPages.length - 1;
            }

            prevEventPage() {
                if (this.currentEventPage > 0) {
                    this.currentEventPage--;
                    this.updateEventWindow();
                }
            }

            nextEventPage() {
                if (this.currentEventPage < this.eventPages.length - 1) {
                    this.currentEventPage++;
                    this.updateEventWindow();
                }
            }

            closeEvent() {
                this.eventWindow.style.display = 'none';
            }

            isPlayerActionComplete() {
                const currentPlayer = this.players[this.currentPlayerIndex];

                // すべてのユニットが行動済みかチェック
                const allUnitsActed = currentPlayer.units.every(unit => unit.hasActed);

                // すべての建物が生産を完了したかチェック
                const allBuildingsProduced = currentPlayer.buildings.every(building => building.hasProduced);

                // プレイヤーが使用可能なすべてのアクションを実行したかチェック
                const allActionsUsed = !this.selectedAction && !this.selectedUnit;

                // リソースが一定量以上たまっているかチェック
                const excessResources = Object.values(currentPlayer.resources).some(amount => amount > 50);

                return allUnitsActed && allBuildingsProduced && allActionsUsed && !excessResources;
            }


            //#region handleClick

            handleClick(pointer) {
                if (this.gameState !== 'PLAYER_PHASE') return;

                const hex = this.tileLayer.layout.pixelToHex({ x: pointer.x, y: pointer.y });
                const roundedHex = new Hex(
                    Math.round(hex.q),
                    Math.round(hex.r),
                    Math.round(hex.s)
                );
                const tileKey = `${roundedHex.q},${roundedHex.r},${roundedHex.s}`;
                const tile = this.tileLayer.grid[tileKey];

                if (!tile) {
                    console.log('ゲームグリッドの外をクリックしました');
                    return;
                }

                const unit = this.getUnitAt(roundedHex);
                const currentPlayer = this.players[this.currentPlayerIndex];

                // 右クリックの処理
                if (pointer.rightButtonDown()) {
                    this.handleRightClick(roundedHex);
                    return;
                }

                // ユニットをクリックした場合の処理
                if (unit) {
                    this.handleUnitClick(unit, roundedHex);
                    return;
                }

                // 選択したユニットを移動させる場合の処理
                if (
                    this.selectedUnit &&
                    this.guiLayer.highlightedHexes.some((h) => h.equals(roundedHex))
                ) {
                    this.moveSelectedUnitTo(roundedHex);
                    return;
                }

                // 選択したアクションの処理
                if (this.selectedAction) {
                    this.handleSelectedAction(roundedHex, currentPlayer);
                    return;
                }

                console.log(`空のタイルをクリックしました: ${roundedHex.q},${roundedHex.r},${roundedHex.s}`);
            }

            handleRightClick(roundedHex) {
                if (
                    this.selectedUnit &&
                    this.guiLayer.highlightedHexes.some((h) => h.equals(roundedHex))
                ) {
                    this.moveUnit(this.selectedUnit, roundedHex);
                    this.guiLayer.clearHighlight();
                    this.selectedUnit = null;
                }
            }

            handleUnitClick(unit, roundedHex) {

                console.log('handleUnitClick');

                this.showUnitInfo(unit);
                if (unit.player === this.currentPlayerIndex) {
                    const movementRange = this.calculateMovementRange(unit);
                    this.guiLayer.highlightHexes(movementRange);
                    this.selectedUnit = unit;
                }
            }

            moveSelectedUnitTo(roundedHex) {
                this.moveUnit(this.selectedUnit, roundedHex);
                this.guiLayer.clearHighlight();
                this.selectedUnit = null;
            }

            handleSelectedAction(roundedHex, currentPlayer) {
                switch (this.selectedAction) {
                    case 'expand':
                        if (this.canExpandTo(currentPlayer, roundedHex)) {
                            currentPlayer.expandTerritory(roundedHex, this.tileLayer.grid);
                            this.tileLayer.draw();
                            this.updateResourceDisplay();
                        }
                        break;
                    case 'unit':
                        if (this.canCreateUnitAt(currentPlayer, roundedHex)) {
                            if (currentPlayer.createUnit('開拓者', roundedHex)) {
                                this.characterLayer.addCharacter(roundedHex, 'S');
                                this.characterLayer.draw();
                                this.updateResourceDisplay();
                            }
                        }
                        break;
                    case 'building':
                        if (this.canConstructBuildingAt(currentPlayer, roundedHex)) {
                            if (currentPlayer.constructBuilding('都市', roundedHex)) {
                                this.buildingLayer.addBuilding(roundedHex, 'C');
                                this.buildingLayer.draw();
                                this.updateResourceDisplay();
                            }
                        }
                        break;
                }
                this.selectedAction = null;
            }

            //#region Move

            calculateMovementRange(unit) {
                const movementRange = [];
                const queue = [{hex: unit.hex, remainingMovement: unit.movement}];
                const visited = new Set();

                while (queue.length > 0) {
                    const current = queue.shift();
                    const key = `${current.hex.q},${current.hex.r},${current.hex.s}`;

                    if (visited.has(key)) continue;
                    visited.add(key);

                    movementRange.push(current.hex);

                    const neighbors = this.getNeighbors(current.hex);
                    for (const neighbor of neighbors) {
                        const tile = this.tileLayer.grid[`${neighbor.q},${neighbor.r},${neighbor.s}`];
                        if (tile) {
                            const movementCost = this.getMovementCost(current.hex, neighbor, tile);
                            const remainingMovement = current.remainingMovement - movementCost;
                            if (remainingMovement >= 0) {
                                queue.push({hex: neighbor, remainingMovement: remainingMovement});
                            }
                        }
                    }
                }

                return movementRange;
            }

            getNeighbors(hex) {
                const directions = [
                    new Hex(1, -1, 0), new Hex(1, 0, -1), new Hex(0, 1, -1),
                    new Hex(-1, 1, 0), new Hex(-1, 0, 1), new Hex(0, -1, 1)
                ];
                return directions.map(dir => hex.add(dir));
            }

            // getMovementCost(fromHex, toHex, toTile) {
            //     // Implement movement cost calculation based on terrain and edges
            //     // For simplicity, we'll just use the tile's movementCost
            //     return toTile.movementCost || 1;
            // }

            getMovementCost(fromHex, toHex, toTile) {
                if (toTile.type === 'Void') {
                    return Infinity; // 無限大のコストを返す
                }
                
                let cost = toTile.movementCost;

                // エッジの移動コストを考慮
                const direction = Hex.directions.findIndex(dir => dir.equals(toHex.subtract(fromHex)));
                const edgeType = fromHex.getEdge(direction);
                switch (edgeType) {
                    case 'river':
                        cost += 2;  // 川を渡るのに追加コスト
                        break;
                    case 'wall':
                        cost += 1000;  // 壁は事実上通過不可能
                        break;
                }

                return cost;
            }

            //         for (const hex of path) {
            //             const tile = this.tileLayer.grid[`${hex.q},${hex.r},${hex.s}`];
            //             const movementCost = this.getMovementCost(unit.hex, hex, tile);
            //             if (remainingMovement - movementCost < 0) break;
            //             remainingMovement -= movementCost;
            //             unit.hex = hex;
            //         }
            //         this.characterLayer.moveCharacter(unit, unit.hex);
            //         this.characterLayer.draw();
            //     }
            // }

            moveUnit(unit, targetHex) {
                const path = this.findPath(unit.hex, targetHex);
                if (path) {
                    let remainingMovement = unit.movement;
                    for (const hex of path) {
                        if (!this.validIndex(hex.q, hex.r, hex.s)) {
                            break;  // マップ外に出ようとした場合、移動を中止
                        }
                        const tile = this.tileLayer.grid[`${hex.q},${hex.r},${hex.s}`];
                        const movementCost = this.getMovementCost(unit.hex, hex, tile);
                        if (remainingMovement - movementCost < 0) break;
                        remainingMovement -= movementCost;
                        unit.hex = hex;
                    }
                    this.characterLayer.moveCharacter(unit, unit.hex);
                    this.characterLayer.draw();
                }
            }

            findPath(startHex, targetHex) {
                const openSet = new PriorityQueue();
                const cameFrom = new Map();
                const gScore = new Map();
                const fScore = new Map();

                const start = startHex.toString();
                openSet.enqueue(start, 0);
                gScore.set(start, 0);
                fScore.set(start, this.heuristic(startHex, targetHex));

                while (!openSet.isEmpty()) {
                    const current = Hex.fromString(openSet.dequeue());

                    if (current.equals(targetHex)) {
                        return this.reconstructPath(cameFrom, current);
                    }

                    const neighbors = this.getNeighbors(current);
                    for (const neighbor of neighbors) {
                        const tile = this.tileLayer.grid[`${neighbor.q},${neighbor.r},${neighbor.s}`];
                        if (!tile) continue;

                        const tentativeGScore = gScore.get(current.toString()) + this.getMovementCost(current, neighbor, tile);

                        const neighborStr = neighbor.toString();
                        if (tentativeGScore < (gScore.get(neighborStr) || Infinity)) {
                            cameFrom.set(neighborStr, current);
                            gScore.set(neighborStr, tentativeGScore);
                            fScore.set(neighborStr, tentativeGScore + this.heuristic(neighbor, targetHex));
                            if (!openSet.includes(neighborStr)) {
                                openSet.enqueue(neighborStr, fScore.get(neighborStr));
                            }
                        }
                    }
                }

                return null; // Path not found
            }

            heuristic(a, b) {
                return Math.max(Math.abs(a.q - b.q), Math.abs(a.r - b.r), Math.abs(a.s - b.s));
            }

            reconstructPath(cameFrom, current) {
                const path = [current];
                while (cameFrom.has(current.toString())) {
                    current = cameFrom.get(current.toString());
                    path.unshift(current);
                }
                return path;
            }

            //#endregion Move



            canExpandTo(player, hex) {
                return !player.territory.some(h => h.equals(hex)) &&
                      player.territory.some(h => this.getDistance(h, hex) === 1) &&
                      player.resources.金 >= 10;
            }

            canCreateUnitAt(player, hex) {
                return player.territory.some(h => h.equals(hex)) &&
                      !this.characterLayer.characters.some(c => c.hex.equals(hex));
            }

            canConstructBuildingAt(player, hex) {
                return player.territory.some(h => h.equals(hex)) &&
                      !this.buildingLayer.buildings.some(b => b.hex.equals(hex));
            }

            getDistance(a, b) {
                return Math.max(Math.abs(a.q - b.q), Math.abs(a.r - b.r), Math.abs(a.s - b.s));
            }

            showMessage(message) {
                if (this.messageText) {
                    this.messageText.destroy();
                }
                this.messageText = this.add.text(400, 550, message, { fontSize: '18px', fill: '#fff' }).setOrigin(0.5);
            }

            // ターン終了ボタンのハンドラ
            onEndTurnButtonClick() {
                if (this.gameState === 'PLAYER_PHASE') {
                    this.endPlayerPhase();
                }
            }    
            
            createGrid() {
                const tileData = this.dataManager.get('tiles').tiles;
                const tileTypes = tileData.map(tile => tile.name);
                for (let q = -5; q <= 5; q++) {
                    for (let r = Math.max(-5, -q - 5); r <= Math.min(5, -q + 5); r++) {
                        let s = -q - r;
                        if (Math.abs(s) <= 5) {
                            let hex = new Hex(q, r, s);
                            let type = Phaser.Math.RND.pick(tileTypes);
                            let key = `${q},${r},${s}`;
                            this.grid[key] = new Tile(q, r, s, type, tileData, this.dataManager);
                            
                            // ランダムにエッジを追加（例として）
                            for (let i = 0; i < 6; i++) {
                                if (Math.random() < 0.1) {  // 10%の確率でエッジを追加
                                    hex.addEdge(i, Math.random() < 0.5 ? 'river' : 'wall');
                                }
                            }
                        }
                    }
                }
            }

            getMovementCost(fromHex, toHex, toTile) {
                let cost = toTile.movementCost;

                // エッジの移動コストを考慮
                const direction = Hex.directions.findIndex(dir => dir.equals(toHex.subtract(fromHex)));
                const edgeType = fromHex.getEdge(direction);
                switch (edgeType) {
                    case 'river':
                        cost += 2;  // 川を渡るのに追加コスト
                        break;
                    case 'wall':
                        cost += 1000;  // 壁は事実上通過不可能
                        break;
                }

                return cost;
            }

            drawHexagon(x, y, size, color) {
                this.graphics.lineStyle(2, 0x000000, 1);
                this.graphics.fillStyle(color, 1);
                this.graphics.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = 2 * Math.PI / 6 * (i + 0.5);
                    const hx = x + size * Math.cos(angle);
                    const hy = y + size * Math.sin(angle);
                    if (i === 0) {
                        this.graphics.moveTo(hx, hy);
                    } else {
                        this.graphics.lineTo(hx, hy);
                    }
                    
                    // エッジを描画
                    const hex = this.tileLayer.layout.pixelToHex({x, y});
                    const edgeType = hex.getEdge(i);
                    if (edgeType) {
                        const nextAngle = 2 * Math.PI / 6 * ((i + 1) % 6 + 0.5);
                        const nhx = x + size * Math.cos(nextAngle);
                        const nhy = y + size * Math.sin(nextAngle);
                        this.graphics.moveTo(hx, hy);
                        this.graphics.lineStyle(4, edgeType === 'river' ? 0x0000FF : 0xFF0000, 1);
                        this.graphics.lineTo(nhx, nhy);
                        this.graphics.lineStyle(2, 0x000000, 1);
                    }
                }
                this.graphics.closePath();
                this.graphics.fillPath();
                this.graphics.strokePath();
            }
                    

        }//GameScene



        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            scene: [GameScene]
        };

        const game = new Phaser.Game(config);
    </script>
